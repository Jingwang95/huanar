plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.huanar.le'
    compileSdk 34

    defaultConfig {
        applicationId "com.huanar.le"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // 自签名：自用安装不需要配置正规密钥库，手机允许"未知来源"即可安装。
    // 密钥库文件由 workflow 或本地命令自动生成（见 说明.md 第一步）。
    signingConfigs {
        selfsign {
            storeFile file('selfsign.jks')
            storePassword 'huanar123'
            keyAlias 'huanar'
            keyPassword 'huanar123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.selfsign
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
