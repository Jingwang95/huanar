name: Build APK

# ⚠️ 这个文件是给你救急用的副本。
#
# GitHub 只认 .github/workflows/build-apk.yml 这个位置。
# 如果你在电脑上怎么也找不到隐藏的 .github 文件夹，可以这样做：
#
#   1. 把本文件（workflow-build-apk.yml）直接上传到仓库根目录
#   2. 在 GitHub 网页上点开它 → 右上角铅笔图标（Edit）
#   3. 点文件名那一栏，把名字改成：.github/workflows/build-apk.yml
#      （GitHub 会自动把斜杠理解成新建文件夹）
#   4. 提交，然后去 Actions 标签看
#
# 内容与 .github/workflows/build-apk.yml 完全一致。

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取回代码
        uses: actions/checkout@v4

      - name: 安装 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 生成自签名证书
        run: |
          keytool -genkeypair -v \
            -keystore app/selfsign.jks \
            -alias huanar \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass huanar123 -keypass huanar123 \
            -dname "CN=HuaNaErLe, OU=Self, O=Self, L=CN, S=CN, C=CN"

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 编译 APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 把 APK 放到可下载的地方
        uses: actions/upload-artifact@v4
        with:
          name: 花哪儿了-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
